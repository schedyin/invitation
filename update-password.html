<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password</title>
  
  <!-- Import IBM Plex Sans Font -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&display=swap');
    body {
      font-family: 'IBM Plex Sans', sans-serif;
    }
  </style>

  <!-- Tailwind CSS for styling -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Supabase JS Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#002726] min-h-screen m-0">

  <!-- Main Container -->
  <div class="flex items-center justify-center min-h-screen">
    <div class="bg-[#032E2E] bg-opacity-70 backdrop-blur-md border border-white/10 p-8 w-full max-w-md" style="border-radius: 16px;">
      
      <h2 class="text-2xl font-medium text-white mb-6">Set New Password</h2>
      
      <form id="password-reset-form" class="flex flex-col gap-5">
        <input 
          type="password" 
          id="new-password" 
          placeholder="Enter your new password" 
          required
          class="p-4 bg-white/5 border border-white/20 text-white placeholder-white/40 focus:outline-none focus:border-white transition-colors"
          style="border-radius: 16px;" 
        />
        
        <button 
          type="submit" 
          class="p-4 bg-white text-[#032E2E] font-medium hover:bg-gray-200 transition-all duration-300"
          style="border-radius: 16px; transition-timing-function: cubic-bezier(0.25, 0.8, 0.25, 1);">
          Save Password
        </button>
      </form>
      
      <div id="status-message" class="mt-4 text-sm hidden text-center"></div>
    </div>
  </div>

  <!-- Supabase Logic -->
  <script>
    // 1. Initialize Supabase
    // REPLACE THESE with your actual Supabase project URL and anon key
    const SUPABASE_URL = 'https://YOUR_PROJECT_ID.supabase.co';
    const SUPABASE_ANON_KEY = 'YOUR_ANON_KEY';
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 2. Handle the form submission
    document.getElementById('password-reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const newPassword = document.getElementById('new-password').value;
      const statusDiv = document.getElementById('status-message');
      const submitBtn = e.target.querySelector('button[type="submit"]');

      // Update UI to show loading state
      submitBtn.textContent = 'Saving...';
      submitBtn.disabled = true;
      submitBtn.classList.add('opacity-50');

      // Supabase uses the token hash in the URL (which it parsed automatically) to authorize this
      const { data, error } = await supabase.auth.updateUser({
        password: newPassword
      });

      // Reset button state
      submitBtn.textContent = 'Save Password';
      submitBtn.disabled = false;
      submitBtn.classList.remove('opacity-50');
      statusDiv.classList.remove('hidden');
      
      if (error) {
        statusDiv.textContent = error.message;
        statusDiv.className = 'mt-4 text-sm text-red-400 text-center';
      } else {
        statusDiv.textContent = 'Password updated successfully! Redirecting to login...';
        statusDiv.className = 'mt-4 text-sm text-green-400 text-center';
        
        // Redirect to your actual login page after success
        setTimeout(() => {
          window.location.href = '/login.html'; // Change this to your actual login route
        }, 2500);
      }
    });
  </script>
</body>
</html>

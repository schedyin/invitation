<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Footer - Missing Piece Invites</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Manrope', sans-serif;
    background: #ffffff;
    padding: 40px 30px;
  }

  .footer {
    display: flex;
    flex-wrap: wrap;
    gap: 30px;
    max-width: 1600px;
    margin: 0 auto;
    align-items: flex-start;
  }

  /* ---------- Left side stack ---------- */
  .left-stack {
    display: flex;
    flex-wrap: nowrap;
    gap: 30px;
    flex: 0 0 auto;
  }

  .brand { flex: 0 0 180px; }
  .help { flex: 0 0 220px; }
  .info { flex: 0 0 140px; }

  .brand h1 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.03em;
    color: rgb(0, 0, 0);
    line-height: 1.25;
  }

  .help h3 {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.03em;
    color: rgb(28, 28, 28);
    line-height: 1.4;
    margin-bottom: 14px;
  }

  .help a.email {
    display: inline-block;
    font-size: 15px;
    letter-spacing: -0.03em;
    color: rgb(28, 28, 28);
    text-decoration: none;
    margin-bottom: 18px;
  }
  .help a.email:hover { color: rgb(0, 153, 255); text-decoration: underline; }

  .socials {
    display: flex;
    gap: 10px;
  }

  .socials a {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    overflow: hidden;
    display: block;
  }

  .socials img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .info h3 {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.03em;
    color: rgb(28, 28, 28);
    margin-bottom: 14px;
  }

  .info a {
    display: block;
    font-size: 15px;
    letter-spacing: -0.03em;
    color: rgb(28, 28, 28);
    text-decoration: none;
    margin-bottom: 14px;
  }
  .info a:hover { color: rgb(0, 153, 255); text-decoration: underline; }
  .info a:visited, .help a:visited { color: rgb(28, 28, 28); }

  /* ---------- Right side card ---------- */
  .right-side {
    flex: 1 1 400px;
    min-width: 400px;
  }

  .card {
    position: relative;
    width: 100%;
    height: 260px;
    background: rgb(255, 255, 255);
    border: 1px solid rgb(0, 0, 0);
    border-radius: 20px;
    overflow: hidden;
    display: flex;
    align-items: flex-start;
  }

  .content {
    position: relative;
    z-index: 2;
    padding: 28px 28px;
    max-width: 640px;
  }

  h1.card-title {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.03em;
    color: rgb(0,0,0);
    line-height: 1.2;
    margin-bottom: 10px;
  }

  .subtitle {
    font-size: 13px;
    font-weight: 500;
    letter-spacing: -0.02em;
    line-height: 1.6em;
    color: rgb(94, 94, 94);
    margin-bottom: 18px;
  }

  .cta {
    display: inline-block;
    width: fit-content;
    white-space: nowrap;
    background: rgb(0, 0, 0);
    color: rgb(255,255,255);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: -0.03em;
    padding: 13px 26px;
    border-radius: 60px;
    text-decoration: none;
    transition: transform 0.2s ease, background 0.2s ease;
  }
  .cta:hover { background: #d4145a; transform: translateY(-2px); }

  .couple-ad {
    position: absolute;
    right: 0;
    top: 30px;
    height: 100%;
    width: 200px;
    object-fit: cover;
    object-position: top;
    border-top-right-radius: 19px;
    z-index: 1;
  }

  @media (max-width: 640px) {
    .footer { flex-wrap: wrap; }
    .left-stack { flex-wrap: wrap; flex: 1 1 100%; }
    .brand, .help, .info { flex: 1 1 200px; }
    .right-side { flex: 1 1 100%; }
    .card { flex-direction: column; align-items: center; height: auto; }
    .content { padding: 32px 24px; max-width: 100%; }
    h1.card-title { font-size: 24px; }
    .brand h1 { font-size: 26px; }
    .couple-ad {
      position: relative;
      width: 80%;
      max-width: 320px;
      height: auto;
      object-fit: contain;
      object-position: center;
      margin: 12px auto 0;
      display: block;
      border-top-right-radius: 0;
    }
  }
</style>
</head>
<body>

  <div class="footer">

    <div class="left-stack">
      <div class="brand">
        <h1>Website Templates for Wedding Invites</h1>
      </div>

      <div class="help">
        <h3>Need any help ? We've got your back.</h3>
        <a class="email" href="mailto:hello@missingpieceinvites.com">hello@missingpieceinvites.com</a>
        <div class="socials">
          <a href="https://www.instagram.com/missingpieceinvites" target="_blank" rel="noopener" aria-label="Instagram">
            <img src="https://framerusercontent.com/images/mTNpaCYEtvbU38EdLAwWSkz3I.png?width=50&height=50" alt="Instagram">
          </a>
          <a href="https://www.youtube.com/@MissingPieceInvites" target="_blank" rel="noopener" aria-label="YouTube">
            <img src="https://framerusercontent.com/images/Zkho1ZBitcL8cRrDurkSmMrxx20.png?width=50&height=50" alt="YouTube">
          </a>
        </div>
      </div>

      <div class="info">
        <h3>Information</h3>
        <a href="./about-page">About Us</a>
        <a href="./contact-us">Contact us</a>
        <a href="./privacy-policy">Privacy Policy</a>
        <a href="./refund-policy">Refund Policy</a>
        <a href="./terms">Terms</a>
      </div>
    </div>

    <div class="right-side">
      <div class="card">
        <div class="content">
          <h1 class="card-title">Invite Your Guests in 10 Minutes!</h1>
          <p class="subtitle">Choose. Customise. Share.</p>
          <a class="cta" href="./templates">Choose a template</a>
        </div>
        <picture>
          <source media="(max-width: 640px)" srcset="https://framerusercontent.com/images/hQ7kq7nwm4rhjd0QsyrxKmHaUk.png?width=1024&height=1536">
          <img class="couple-ad"
               src="https://framerusercontent.com/images/uvtfU55yBafBFhT3feL3T68KJs.png?scale-down-to=1024&width=1024&height=1536"
               alt="Wedding couple illustration">
        </picture>
      </div>
    </div>

  </div>

</body>
</html>
